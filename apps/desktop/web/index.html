<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="toolbar">
    <span class="brand">Mark</span>
    <h1 id="filename">No document open</h1>
    <button id="open" type="button">Open file</button>
  </header>
  <main class="sheet">
    <p id="status" role="status">Open a markdown file to start reading.</p>
    <p id="error" role="alert"></p>
    <article id="preview" class="markdown" aria-label="Rendered markdown"></article>
  </main>
</body>
</html>
