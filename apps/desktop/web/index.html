<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/highlight.min.js"></script>
  <script src="render.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#preview">Skip to document</a>
  <header class="toolbar">
    <span class="brand"><svg width="22" height="22" aria-hidden="true"><symbol id="mark-symbol" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linejoin="round"><path d="M54 178V72l74 45 74-45v106l-74-44Z"/><path d="M128 117v76" stroke-linecap="round"/></symbol><use href="#mark-symbol"/></svg>Mark</span>
    <h1 id="filename">No document open</h1>
    <button id="toggle" type="button" title="Ctrl/⌘ E" aria-keyshortcuts="Control+e Meta+e" aria-pressed="false" disabled>Edit</button>
    <button id="save" type="button" title="Ctrl/⌘ S" aria-keyshortcuts="Control+s Meta+s" disabled>Save</button>
    <button id="open" type="button" title="Ctrl/⌘ O" aria-keyshortcuts="Control+o Meta+o">Open file</button>
  </header>
  <main class="sheet">
    <p id="status" role="status" aria-atomic="true">Open a markdown file to start reading.</p>
    <p id="error" role="alert"></p>
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <svg class="file-mark" width="52" height="52" aria-hidden="true"><use href="#mark-symbol"/></svg>
      <h2 id="welcome-title">Your markdown, ready to read.</h2>
      <p>Open a README, an agent's instructions, or the notes you're working on.</p>
      <button id="welcome-open" type="button">Open a markdown file</button>
      <p class="welcome-note">Local files. Original formatting kept intact.</p>
    </section>
    <div id="panes" class="panes">
      <section id="source-pane" hidden>
        <label for="source">Markdown source</label>
        <textarea id="source" spellcheck="false" placeholder="Write markdown here…"></textarea>
      </section>
      <article id="preview" class="markdown" tabindex="0" aria-label="Rendered markdown"></article>
    </div>
  </main>
</body>
</html>
