name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix extensions/vscode
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Verify Rust, web, WASM and extension
        run: scripts/check.sh
